<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Curious Hat - Rede social de fofocas e segredos temporários." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Curious Hat | Segredos Temporários</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, para a tela não piscar.
      try {
        if (localStorage.getItem("curiousHat_theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch {
        // Sem acesso ao armazenamento, fica o tema escuro padrão.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
